name: Build Kobold installer ISO

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Signed Kobold payload tag (normally stable)
        required: true
        default: stable
        type: string

concurrency:
  group: iso-${{ inputs.image_tag }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Free runner disk space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Static checks
        run: ./tests/static-checks.sh

      - name: Install Cosign for upstream verification
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.3

      - name: Verify pinned Fedora installer base
        run: ./ci/verify-fedora-base.sh iso/Containerfile

      - name: Validate tag and image name
        id: meta
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Verify selected payload signature
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ inputs.image_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build-testing.yml@refs/heads/${DEFAULT_BRANCH}"
          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${IMAGE}:${TAG}" >/dev/null

      - name: Pull payload into host container storage
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ inputs.image_tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | sudo podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          sudo podman pull "${IMAGE}:${TAG}"

      - name: Build installer environment
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ inputs.image_tag }}
        run: |
          sudo env \
            "PAYLOAD_IMAGE=${IMAGE}:${TAG}" \
            "TARGET_IMAGE=${IMAGE}:${TAG}" \
            "INSTALLER_TAG=${TAG}" \
            ./iso/build-installer.sh

      - name: Build embedded-payload generic ISO
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          sudo env \
            "INSTALLER_IMAGE=localhost/kobold-installer:${TAG}" \
            "PAYLOAD_IMAGE=${IMAGE}:${TAG}" \
            "OUTPUT_DIR=${PWD}/output/iso" \
            "ISO_NAME=kobold-${TAG}-x86_64.iso" \
            ./iso/build-iso.sh
          sudo skopeo inspect "containers-storage:${IMAGE}:${TAG}" > "output/iso/kobold-${TAG}-x86_64.iso.manifest.json"

      - name: Upload ISO, checksum and payload manifest
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: kobold-${{ inputs.image_tag }}-x86_64
          if-no-files-found: error
          compression-level: 0
          path: |
            output/iso/kobold-${{ inputs.image_tag }}-x86_64.iso
            output/iso/kobold-${{ inputs.image_tag }}-x86_64.iso-CHECKSUM
            output/iso/kobold-${{ inputs.image_tag }}-x86_64.iso.manifest.json
