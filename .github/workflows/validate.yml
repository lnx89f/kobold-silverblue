name: Validate Kobold

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Free runner disk space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Static checks
        run: ./tests/static-checks.sh

      - name: Verify pinned Fedora Silverblue base
        run: ./ci/verify-fedora-base.sh Containerfile

      - name: Build candidate
        run: |
          set -euo pipefail
          version="44.$(date -u +%Y%m%d).${GITHUB_SHA::12}"
          sudo podman build --pull=always --no-cache --format oci \
            --build-arg "VERSION=${version}" \
            --build-arg "SOURCE_REVISION=${GITHUB_SHA}" \
            -t localhost/kobold:validate .

      - name: Image invariants and bootc lint
        run: |
          sudo podman run --rm --entrypoint /usr/libexec/kobold-image-invariants localhost/kobold:validate --build
          sudo podman run --rm --privileged --entrypoint bootc localhost/kobold:validate container lint --fatal-warnings
